name: Package and CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build pytest numpy scipy pandas zarr
      - run: python -m build
      - run: python tools/check_distribution.py dist/*.whl
      - run: python -m pip install --no-deps dist/*.whl
      - name: CPU utility tests
        run: >-
          python -m pytest
          tests/floatsom/test_resource_limits.py
          tests/floatsom/test_local_storage_wipe.py
          tests/floatsom/test_zarr_utils.py
          tests/test_default_profiles.py

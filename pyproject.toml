[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "floatsom"
version = "0.1.0"
description = "FloatSOM core library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "ray[default]>=2.6.0",
    "zarr>=3.0.0",
    "scikit-learn>=1.3.0",
    "psutil>=5.9.0",
    "numcodecs>=0.12.0",
    "threadpoolctl>=3.1.0",
]

[project.urls]
Homepage = "https://github.com/1ordinateur/floatsom"
Repository = "https://github.com/1ordinateur/floatsom"
Issues = "https://github.com/1ordinateur/floatsom/issues"
Publication = "https://github.com/1ordinateur/floatsom-publication"

[project.optional-dependencies]
cuda12 = ["cupy-cuda12x>=13.6.0,<14", "nvidia-nccl-cu12>=2.27.7,<3; sys_platform == 'linux'"]
cuda13 = ["cupy-cuda13x>=13.6.0,<14", "nvidia-nccl-cu13>=2.27.7,<3; sys_platform == 'linux'"]
dev = ["pytest>=8", "build>=1.2"]
minisom = [
    "minisom>=2.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"floatsom.defaults" = ["profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu_scaling: requires CUDA and Ray GPU resources",
]

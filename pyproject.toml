[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "floatsom"
version = "0.1.0"
description = "GPU self-organizing maps (SOMs) for large tables, for example cytometry data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["self-organizing map", "SOM", "GPU", "CUDA", "CuPy", "clustering", "cytometry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "zarr>=3.0.0",
    "scikit-learn>=1.3.0",
    "psutil>=5.9.0",
    "numcodecs>=0.12.0",
    "threadpoolctl>=3.1.0",
    # Grid layout when RAPIDS is not installed (reform_grid).
    "networkx>=3.4",
]

[project.urls]
Homepage = "https://github.com/1ordinateur/floatsom"
Repository = "https://github.com/1ordinateur/floatsom"
Issues = "https://github.com/1ordinateur/floatsom/issues"
Publication = "https://github.com/1ordinateur/floatsom-publication"

[project.optional-dependencies]
# One GPU. CuPy 14 with [ctk] installs the CUDA libraries from pip, so only
# the GPU driver is necessary. Select the extra from "CUDA Version" in nvidia-smi.
cuda12 = ["cupy-cuda12x[ctk]>=14,<15"]
cuda13 = ["cupy-cuda13x[ctk]>=14,<15"]
# Several GPUs or nodes (ProcessingConfig.ray_config): CuPy, Ray, NCCL and PyTorch.
# FloatSOM does not use PyTorch, but Ray 2.50 and later find the NCCL backend
# only when PyTorch imports. PyTorch pins the exact NCCL version. torch 2.10 is
# the last PyTorch for CUDA 12 on PyPI; torch 2.11 and later use CUDA 13.
ray-cuda12 = ["floatsom[cuda12,ray]", "torch>=2.5,<2.11", "nvidia-nccl-cu12<3; sys_platform == 'linux'"]
ray-cuda13 = ["floatsom[cuda13,ray]", "torch>=2.11", "nvidia-nccl-cu13<3; sys_platform == 'linux'"]
# Ray only, for a cluster module that gives CuPy, NCCL and PyTorch.
ray = ["ray[default]>=2.6.0"]
dev = ["pytest>=8", "build>=1.2", "twine>=6.1"]
# AMD GPUs: install CuPy for ROCm first, then install floatsom with no extra.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"floatsom.defaults" = ["profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu_scaling: requires CUDA and Ray GPU resources",
]
